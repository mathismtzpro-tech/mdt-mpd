<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MDT – Miami Police Department</title>
<style>
:root{--bg:#090c11;--p:#0f141b;--p2:#151b24;--b:#1f2733;--t:#e9edf3;--m:#8591a3;--a:#2563eb;--a2:#1e4fc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100%}
nav{width:250px;background:var(--p);border-right:1px solid var(--b);flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--b)}
.brand b{display:block;font-size:13px;letter-spacing:.14em}.brand small{color:var(--m);font-size:11px}
.menu{padding:10px 8px;flex:1}
.it{display:block;padding:7px 10px 7px 22px;border-radius:6px;color:var(--m);cursor:pointer;font-size:13px}
.it.top{padding-left:10px}.it:hover{background:var(--p2);color:var(--t)}.it.on{background:#2563eb22;color:#fff;box-shadow:inset 2px 0 var(--a)}
.gh{display:flex;justify-content:space-between;padding:9px 10px;margin-top:6px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.gh span{color:var(--m)}
.foot{padding:12px 16px;border-top:1px solid var(--b);font-size:12px;color:var(--m)}.foot a{cursor:pointer}.foot a:hover{color:var(--t)}
main{flex:1;padding:26px 30px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
h2{margin:0;font-size:20px;font-weight:600}h3{margin:20px 0 10px;font-size:12px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid .card{margin:0}
.stat b{font-size:28px;font-weight:600;display:block}.stat span{color:var(--m);font-size:12px}
.hero{display:flex;gap:18px;align-items:center;padding:22px;margin-bottom:18px;border:1px solid var(--b);border-radius:8px;background:linear-gradient(110deg,#12254d,var(--p) 70%)}.hero p{margin:4px 0 0;color:var(--m)}
button{background:var(--a);color:#fff;border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:500;cursor:pointer}button:hover{background:var(--a2)}
button.g{background:transparent;border:1px solid var(--b);color:var(--t)}button.g:hover{background:var(--p2)}button.s{padding:3px 9px;font-size:12px}
input,select,textarea{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px 10px;font:inherit;width:100%}input:focus,select:focus,textarea:focus{outline:1px solid var(--a)}
select.i{width:auto;padding:3px 6px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tr:hover td{background:#ffffff05}
.wrap{overflow-x:auto;padding:4px 8px}
.badge{padding:2px 9px;border-radius:4px;font-size:11px;border:1px solid var(--b)}.actif{background:#2563eb26;border-color:#2563eb;color:#9bbcff}.absent{color:#fff}.hors{color:var(--m)}
.av{width:44px;height:44px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;flex-shrink:0}
.big{width:120px;height:120px;border-radius:8px;background:var(--p2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;overflow:hidden;flex-shrink:0}
.av img,.big img,.vimg img{width:100%;height:100%;object-fit:cover}.vimg{height:140px;border-radius:6px;background:var(--p2);margin-bottom:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--m)}
.row{display:flex;gap:12px;align-items:center}.sp{flex:1}.cols{display:flex;gap:14px;overflow-x:auto;align-items:flex-start}
.col{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:12px;min-width:240px;flex:1}
.chip{background:var(--p2);border-radius:6px;padding:7px 9px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}.chip small{color:var(--m)}
.letter{color:var(--a);font-weight:600;margin:14px 0 6px}.cit{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}.cit:hover{background:var(--p2)}
a.l{color:#9bbcff;cursor:pointer}a.l:hover{text-decoration:underline}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal .card{width:min(500px,100%);max-height:90vh;overflow:auto;margin:0}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:12px}pre{white-space:pre-wrap;font:inherit;margin:0}
.login{max-width:400px;margin:7vh auto}.login .brand{flex-direction:column;border:0;text-align:center}.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;max-height:46vh}main{padding:16px}}
.adm{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;font-size:11px;padding:4px 12px;opacity:.5;background:var(--p)}.adm:hover{opacity:1}.foot{padding-bottom:48px}
body{background:radial-gradient(900px 500px at 70% -10%,#1b3a8a66,transparent),radial-gradient(700px 500px at 0% 100%,#10286066,transparent),#060b18;background-attachment:fixed}
#app{padding:14px;gap:14px}
nav{height:calc(100vh - 28px);top:14px;border-radius:16px;background:linear-gradient(180deg,#0e1b3a,#0a1126);border:1px solid #1b2c52;box-shadow:0 12px 40px #0008}
.brand,.foot{border-color:#1b2c52}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;margin-bottom:2px}.it:not(.top){margin-left:6px}
.it svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it.on{background:linear-gradient(90deg,#2563eb40,#2563eb10);color:#fff;box-shadow:none;border:1px solid #2f5fd0}
.card{background:linear-gradient(180deg,#0f1c3b99,#0b1530aa);border-color:#1b2c52;border-radius:14px}
.tb{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.tile{flex:1;min-width:150px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#0f1c3b,#0b1530);border:1px solid #1b2c52}
.tile small{display:block;color:var(--m);font-size:11px}.tile b{font-size:18px}.tile.me{flex:1.7}
.tile i{margin-left:auto;font-style:normal;width:34px;height:34px;border-radius:9px;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:700}
h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--a);margin-right:10px;box-shadow:0 0 12px var(--a)}
.chip{background:#ffffff0a}
@media(max-width:760px){#app{padding:8px}nav{height:auto;top:0}}
.dr{cursor:grab;user-select:none}.dr:active{cursor:grabbing}.col{min-height:170px}.col.over{border-color:var(--a);background:#2563eb18}
.ln{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--b)}.ln input[type=checkbox]{width:auto}.ln input[type=number]{width:62px;padding:3px 6px}
.bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bubbles span{position:absolute;bottom:-90px;border-radius:50%;border:1px solid #3b82f655;background:radial-gradient(circle at 30% 30%,#60a5fa44,#2563eb10);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(30px,-115vh);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 18px #2563eb0d,0 0 80px #2563eb66}}
#app{position:relative;z-index:1}
.card{border:1px solid #27458f;box-shadow:0 0 0 1px #2563eb14,0 10px 30px #0006,0 0 22px #2563eb14}.card:hover{border-color:#3b6fe0;box-shadow:0 0 0 1px #3b82f633,0 10px 34px #0007,0 0 30px #2563eb2e}
nav{border-color:#27458f;box-shadow:0 0 0 1px #2563eb1a,0 12px 40px #0008,0 0 30px #2563eb18}
.tile{border-color:#27458f;box-shadow:0 0 20px #2563eb14}.tile i{box-shadow:0 0 14px #2563ebaa}
button{box-shadow:0 0 0 1px #3b82f655,0 4px 16px #2563eb55}button.g{box-shadow:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px #2563eb33}
th{border-bottom:1px solid #27458f}.hero{border-color:#2f55b8;box-shadow:0 0 40px #2563eb2e}
.ph h2,.herop h1{background:linear-gradient(90deg,#fff,#9bbcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pub{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 20px 40px}
.pubtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.herop{text-align:center;padding:46px 8px 18px}.herop h1{font-size:clamp(28px,5vw,46px);margin:22px 0 10px;letter-spacing:.04em}
.herop p{max-width:740px;margin:0 auto 10px;color:var(--m);font-size:16px;line-height:1.7}
.logoring{width:160px;height:160px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #3b82f666;box-shadow:0 0 0 10px #2563eb12,0 0 60px #2563eb44;animation:pulse 4s ease-in-out infinite}
.ct{justify-content:center;margin:36px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.opt{cursor:pointer;padding:26px;border-radius:18px;border:1px solid #2a4a99;background:linear-gradient(180deg,#10224a99,#0b1530cc);transition:.2s}
.opt:hover,.opt:focus{outline:none;transform:translateY(-4px);box-shadow:0 0 0 1px #3b82f6,0 12px 40px #2563eb40}
.opt svg{width:36px;height:36px;stroke:#60a5fa;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.opt b{display:block;font-size:18px;margin:14px 0 6px}.opt p{color:var(--m);margin:0 0 14px}.opt span{color:#60a5fa;font-weight:600}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:34px}.vals .card{margin:0;text-align:center}.vals b{color:#9bbcff}
.pubf{text-align:center;color:var(--m);font-size:12px;margin-top:34px}
@media(prefers-reduced-motion:reduce){.bubbles span,.logoring{animation:none}}

<label>Plaque (si véhicule)</label><input id=k_p value="${e(v.plaque)}">
<label>Infractions : coche les lignes du code pénal, le total se calcule seul</label><input id=k_q placeholder="Filtrer le code pénal…" oninput="kfl()">
<div id=k_list style="max-height:200px;overflow:auto;border:1px solid var(--b);border-radius:6px;margin-top:6px">${S.code.map(p=>{const l=v.lignes.find(x=>x.art===p.art&&x.nom===p.nom);return `<div class=ln data-s="${e((p.art+' '+p.nom).toLowerCase())}"><input type=checkbox data-a="${e(p.id)}" ${l?'checked':''} onchange="ksum()"><span class=sp>${e(p.art)} – ${e(p.nom)}</span><small style="color:var(--m)">$${e(p.amende)} · ${e(p.prison)} min</small><input type=number min=1 value="${l?l.q:1}" onchange="ksum()"></div>`}).join('')||'<div class=ln>Code pénal vide</div>'}</div>
<div class=row style="margin-top:10px"><div class=sp><label>Amende totale ($)</label><input type=number id=k_m value="${e(v.montant)}"></div><div class=sp><label>Garde à vue / peine (min)</label><input type=number id=k_g value="${e(v.prison)}"></div></div>
<label>Faits (ce qui s'est passé)</label><textarea rows=3 id=k_f>${e(v.desc)}</textarea><label>Mesures prises</label><textarea rows=2 id=k_s>${e(v.mesure)}</textarea>
<label>Agent</label><select id=k_a>${ag.map(n=>`<option ${n==v.agent?'selected':''}>${e(n)}</option>`).join('')}</select>
<div class=row style="margin-top:16px"><button id=ok>Enregistrer</button><button class=g onclick="cl()">Annuler</button></div></div>`;
$m.style.display='flex';
document.getElementById('ok').onclick=()=>{if(!S.citoyens.length){alert('Aucun citoyen recensé');return}
const lignes=[...document.querySelectorAll('#k_list .ln')].filter(r=>r.querySelector('[type=checkbox]')?.checked).map(r=>{const p=S.code.find(x=>x.id===r.querySelector('[type=checkbox]').dataset.a);return{art:p.art,nom:p.nom,amende:p.amende,prison:p.prison,q:Math.max(1,+r.querySelector('[type=number]').value||1)}});
const d={cit:k_c.value,type:k_t.value,date:k_d.value,lieu:k_l.value,plaque:k_p.value,desc:k_f.value,mesure:k_s.value,montant:k_m.value||'0',prison:k_g.value||'0',agent:k_a.value,lignes,infraction:lignes.map(l=>l.nom+(l.q>1?' ×'+l.q:'')).join(', ')};
if(o)Object.assign(o,d);else S.casiers.push({id:uid(),...d});save();cl();go()}}
function ksum(){let m=0,g=0;document.querySelectorAll('#k_list .ln').forEach(r=>{const c=r.querySelector('[type=checkbox]');if(c&&c.checked){const p=S.code.find(x=>x.id===c.dataset.a),q=Math.max(1,+r.querySelector('[type=number]').value||1);m+=(+p.amende||0)*q;g+=(+p.prison||0)*q}});k_m.value=m;k_g.value=g}
function kfl(){const q=k_q.value.toLowerCase();document.querySelectorAll('#k_list .ln').forEach(r=>r.style.display=(r.dataset.s||'').includes(q)?'':'none')}
const NF=[['nom','Nom','t',1],['prenom','Prénom','t',1],['tel','Téléphone (en jeu)','t']];
const FORMS={plainte:{t:'Déposer plainte',ref:'PL',f:[...NF,['date','Date des faits','d'],['lieu','Lieu des faits','t'],['vise','Personne(s) visée(s)','t'],['desc','Description des faits','a',1]]},
rdv:{t:'Prendre rendez-vous',ref:'RV',f:[...NF,['motif','Motif','s',1,['Dépôt de document','Question / renseignement','Rencontre avec un responsable','Autre']],['jour','Date souhaitée','d'],['msg','Précisions','a']]},
recrutement:{t:'Candidature',ref:'RC',f:[['nom','Nom','t',1],['prenom','Prénom','t',1],['age','Âge (RP)','t'],['tel','Téléphone (en jeu)','t'],['exp','Expérience (RP)','a'],['motiv','Motivations','a',1],['dispo','Disponibilités','t']]}};
const OPTS=[['plainte','plt','Déposer plainte','Signalez des faits dont vous avez été victime ou témoin. Votre plainte est transmise directement à nos agents.'],['rdv','rdv','Prendre rendez-vous','Demandez un rendez-vous avec nos services : renseignement, document ou rencontre avec un responsable.'],['recrutement','rec','Nous rejoindre','Postulez pour intégrer le Miami Police Department et servir la ville.']];
function civil(){return `<div class=pub><div class=pubtop><div class=row>${LOGO(38)}<b style="letter-spacing:.14em">MIAMI PD</b></div><button onclick="A.sl(true)">Connexion agents</button></div>
<section class=herop><div class=logoring>${LOGO(120)}</div><h1>Miami Police Department</h1><p>Le Miami Police Department (MPD) est la force de police de la ville de Miami. Chaque jour, nos agents veillent à la sécurité des habitants, à l'application de la loi et à la protection des personnes et des biens.</p><p>Depuis cette page, vous pouvez déposer plainte, demander un rendez-vous ou postuler pour rejoindre nos rangs. Aucun compte ni e-mail n'est nécessaire.</p></section>
<h2 class=ct>Que souhaitez-vous faire ?</h2><div class=opts>${OPTS.map(([t,ic,ti,d])=>`<div class=opt role=button tabindex=0 onclick="openReq('${t}')" onkeydown="if(event.key==='Enter')openReq('${t}')">${IC(ic)}<b>${ti}</b><p>${d}</p><span>Commencer →</span></div>`).join('')}</div>
<div class=vals><div class=card><b>Protéger</b><br><small style="color:var(--m)">La sécurité de chaque habitant</small></div><div class=card><b>Servir</b><br><small style="color:var(--m)">Écoute, proximité et réactivité</small></div><div class=card><b>Respecter</b><br><small style="color:var(--m)">La loi, avec intégrité</small></div></div>
<div class=pubf>Pour une urgence en cours, utilisez le téléphone en jeu et contactez immédiatement les secours.</div></div>`}
function openReq(t){const F2=FORMS[t];
$m.innerHTML=`<div class=card><h3 style="margin-top:0;color:var(--t);font-size:16px;text-transform:none;letter-spacing:0">${F2.t}</h3><p style="color:var(--m);margin:0 0 6px">Aucun compte ni e-mail requis. Les champs marqués * sont obligatoires.</p>${F2.f.map(([n,l,k,r,o],i)=>`<label>${l}${r?' *':''}</label>`+(k==='a'?`<textarea rows=4 id=q${i}></textarea>`:k==='d'?`<input type=date id=q${i}>`:k==='s'?`<select id=q${i}>${o.map(x=>`<option>${e(x)}</option>`).join('')}</select>`:`<input id=q${i}>`)).join('')}<div class=row style="margin-top:16px"><button id=ok>Envoyer</button><button class=g onclick="cl()">Annuler</button></div></div>`;
$m.style.display='flex';
document.getElementById('ok').onclick=async()=>{const d={};for(const [i,[n,l,k,r]] of F2.f.entries()){const v=document.getElementById('q'+i).value.trim();if(r&&!v){alert('Merci de remplir : '+l);return}d[n]=v}
d.ref=F2.ref+'-'+uid().slice(0,5).toUpperCase();const b=document.getElementById('ok');b.disabled=true;
const {error}=await SB.from('demandes').insert({type:t,data:d});
if(error){b.disabled=false;alert('Envoi impossible pour le moment : '+error.message);return}
$m.innerHTML=`<div class=card style="text-align:center"><h3 style="margin-top:0;color:var(--t);font-size:16px;text-transform:none;letter-spacing:0">Demande envoyée</h3><p>Votre demande a bien été transmise au MPD.<br>Numéro de suivi : <b>${d.ref}</b></p><button onclick="cl()">Fermer</button></div>`}}
const DST=['Nouveau','En cours','Traité','Refusé'];
function dem(t){const L=S.demandes.filter(d=>d.type===t),sm=d=>t==='plainte'?[d.lieu,d.vise].filter(Boolean).join(' · '):t==='rdv'?[d.motif,d.jour].filter(Boolean).join(' · '):[d.age&&d.age+' ans',d.dispo].filter(Boolean).join(' · ');
return H({plainte:'Plaintes',rdv:'Demandes de rendez-vous',recrutement:'Candidatures'}[t])+T(['Date','Réf.','Demandeur','Résumé','Statut',''],L.map(d=>`<tr><td>${e(String(d.created_at).slice(0,10))}<td>${e(d.data.ref)}<td>${e(d.data.nom)} ${e(d.data.prenom)}<td>${e(sm(d.data))}<td><select class=i onchange="A.dst('${d.id}',this.value)">${DST.map(x=>`<option ${x===d.statut?'selected':''}>${x}</option>`).join('')}</select><td><button class="g s" onclick="A.dview('${d.id}')">Voir</button>${can('del')?` <button class="g s" onclick="A.ddel('${d.id}')">Suppr.</button>`:''}</tr>`))}
function dgs(ev,id){ev.dataTransfer.setData('text/plain',id);ev.dataTransfer.effectAllowed='move'}
function dpd(ev,g){ev.preventDefault();const id=ev.dataTransfer.getData('text/plain');if(id)A.mv(id,g)}
function lst(){const q=(document.getElementById('q')?.value||'').toLowerCase(),el=document.getElementById('lst');if(!el)return;
const l=S.citoyens.filter(c=>(cn(c)+' '+c.prenom+' '+c.tel+' '+S.vehicules.filter(v=>v.proprio===cn(c)).map(v=>v.plaque).join(' ')).toLowerCase().includes(q)).sort((a,b)=>cn(a).localeCompare(cn(b)));
let h='',L='';l.forEach(c=>{const x=(c.nom[0]||'#').toUpperCase();if(x!==L){L=x;h+=`<div class=letter>${x}</div>`}h+=`<div class=cit onclick="A.cit('${c.id}')">${av(c)}<div><b>${e(c.nom)} ${e(c.prenom)}</b><br><small style="color:var(--m)">${e(c.adresse)}</small></div></div>`});el.innerHTML=h||'Aucun citoyen'}
function go(){const app=document.getElementById('app');if(!READY){app.innerHTML='<main><div class="card login">Chargement…</div></main>';return}
if(!S.me||!cur()){if(!SHOWLOGIN){app.innerHTML=civil();return}app.innerHTML=`<main><div class="card login"><a class=l onclick="A.sl(false)">← Site public</a><div class=brand>${LOGO(90)}<div><b style="font-size:16px">MIAMI POLICE DEPARTMENT</b><small>Accès réservé aux agents</small></div></div><div class=tabs><button class="${AUTH==='in'?'':'g'}" onclick="A.tab('in')">Connexion</button><button class="${AUTH==='up'?'':'g'}" onclick="A.tab('up')">Créer mon compte</button></div>`+(AUTH==='in'?`<label>Identifiant (nom.prenom@mpd.com)</label><input id=lm><label>Mot de passe</label><input id=lp type=password onkeydown="if(event.key==='Enter')A.login()"><button style="width:100%;margin-top:16px" onclick="A.login()">Se connecter</button>`:`<label>Prénom</label><input id=sn><label>Nom</label><input id=sl><label>Mot de passe</label><input id=sp type=password><label>Confirmer le mot de passe</label><input id=sp2 type=password><button style="width:100%;margin-top:16px" onclick="A.sign()">Créer mon compte</button><p style="color:var(--m);font-size:12px">Ton identifiant sera automatiquement nom.prenom@mpd.com</p>`)+`</div></main>`;return}
app.innerHTML=`<nav><div class=brand>${LOGO(42)}<div><b>MIAMI PD</b><small>Mobile Data Terminal</small></div></div><div class=menu>${MENU.map((m,i)=>typeof m[1]==='string'?`<a class="it top ${cv()===m[0]?'on':''}" onclick="A.view('${m[0]}')">${IC(m[0])}${m[1]}</a>`:`<div class=gh onclick="A.tg(${i})">${m[0]}<span>${S.open[i]??m[1].some(x=>x[0]===cv())?'▾':'▸'}</span></div>`+(S.open[i]??m[1].some(x=>x[0]===cv())?m[1].map(x=>`<a class="it ${cv()===x[0]?'on':''}" onclick="A.view('${x[0]}')">${IC(x[0])}${x[1]}</a>`).join(''):'')).join('')}</div><div class=foot>${e(cur().nom)}<br>${e(cur().grade)} · ${MT(cur().mat)}<br><a onclick="A.prof('${S.me}')">Mon profil</a> · <a onclick="A.out()">Déconnexion</a></div></nav><main>${TB()}${V[S.v]()}</main>${adm()?`<button class="g adm" onclick="A.view('admin')">Admin</button>`:''}`;
if(S.v==='cit'&&!S.cit)lst()}
boot();
</script></body></html>
